<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swift Recruit — Softphone</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 12px 16px;
      background: #FFFFFF;
      border-bottom: 1px solid #E5E7EB;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .teal-dot { width: 7px; height: 7px; border-radius: 50%; background: #0891B2; }
    .candidate-name { font-weight: 600; color: #0F172A; }
    iframe {
      flex: 1;
      border: none;
      width: 100%;
    }
    .fallback {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #64748B;
      font-size: 13px;
    }
    .fallback-title { font-weight: 600; color: #0F172A; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <span class="teal-dot"></span>
    <span>Swift Recruit Softphone</span>
    <span class="candidate-name" id="candidate-name"></span>
  </div>
  <div class="fallback" id="fallback">
    <div class="fallback-title">Softphone embed coming soon</div>
    <div>The embedded softphone is not yet available.</div>
  </div>
  <iframe id="softphone-frame" hidden></iframe>
  <script type="module" src="sidepanel.ts"></script>
</body>
</html>
