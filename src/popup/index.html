<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swift Recruit</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Swift Recruit</h1>
      <p class="subtitle">Candidate Lookup</p>
    </header>

    <section id="login-section">
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@swift-recruit.com" required />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" required />

        <button type="submit" id="login-btn">Log in</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </section>

    <section id="logged-in-section" hidden>
      <p id="user-email"></p>
      <div class="controls">
        <label class="toggle">
          <input type="checkbox" id="auto-scan" checked />
          <span>Auto-scan</span>
        </label>
        <button id="logout-btn">Log out</button>
      </div>
    </section>
  </div>
  <script type="module" src="popup.ts"></script>
</body>
</html>
