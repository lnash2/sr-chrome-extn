<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ringover Empower — Call Detail (fixture)</title>
</head>
<body>
  <!--
    Fixture page mirroring empower.ringover.com call-detail layout.
    Used by Vitest scraper tests (headless, jsdom).
    URL would be: https://empower.ringover.com/logs/12345
  -->

  <div class="call-detail-page">

    <!-- ===== Contact / Call header (LEFT — candidate phone lives here) ===== -->
    <div class="call-header" data-testid="call-header">
      <div class="contact-info">
        <h2 class="contact-name">01353 648222</h2>
        <div class="contact-number">
          <a href="tel:+441353648222">
            <svg class="phone-icon"></svg>
            01353 648222
          </a>
        </div>
        <span class="call-direction">Inbound call</span>
        <span class="call-duration">4m 32s</span>
        <span class="call-date">22 Jul 2026, 14:23</span>
      </div>
    </div>

    <!-- ===== Call transcript / notes region ===== -->
    <div class="call-content">
      <div class="transcript-section">
        <h3>Call Summary</h3>
        <p>Candidate enquiring about HGV Class 2 positions in the Essex area. Currently holds C+E licence, available from next Monday.</p>
      </div>
    </div>

    <!-- ===== Agent block (RIGHT — recruiter's own details, must NOT be scraped) ===== -->
    <div class="agent-section" data-testid="agent-info">
      <h3>Agent</h3>
      <div class="agent-details">
        <span class="agent-name">Sarah Connor</span>
        <span class="agent-email">sarah.connor@swift-recruit.co.uk</span>
        <span class="agent-phone">
          <a href="tel:+447911123456">07911 123456</a>
        </span>
        <span class="agent-extension">Ext. 201</span>
      </div>
    </div>

  </div>
</body>
</html>
