<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ringover Empower — Call Detail (fixture)</title>
</head>
<body>
  <!--
    Fixture page mirroring empower.ringover.com call-detail layout.
    Based on real DOM inspection of empower.ringover.com/logs/ringover/{id}.
    Used by Vitest scraper tests (headless, jsdom).
  -->

  <!-- ===== DECOY: Log list / side rail (OUTSIDE the studio container) ===== -->
  <!-- These numbers must NEVER be scraped — they belong to other calls -->
  <div class="logList">
    <div class="logEntry">
      <span class="logPhone">01387 272143</span>
      <span class="logDate">Jul 22, 14:05</span>
    </div>
    <div class="logEntry">
      <span class="logPhone">07700 900555</span>
      <span class="logDate">Jul 22, 13:48</span>
    </div>
  </div>

  <!-- ===== STUDIO: Call detail container ===== -->
  <div class="module_logs" data-tab="studio">
    <div class="header">
      <div class="titleContainer">
        <div class="back ro-btn ro-variant-ghost ro-size-sm ro-color-scheme-product" id="closeModuleBtn">
        </div>
      </div>
    </div>

    <div>
      <div>
        <div class="callIcon in"></div>
      </div>
      <div>
        <div class="view"></div>
        <div class="edit" hidden></div>
      </div>
      <div></div>

      <div class="headerInfo ro-text ro-size-xs">
        <div class="date">4:21 p.m. – Jul 23, 2026</div>
        <span class="separator"></span>
        <div class="duration">3 min 35 sec</div>
        <div class="durationSkeleton skeleton-loader" hidden></div>
        <span class="separator2" hidden></span>
      </div>

      <div class="participantsInfo"></div>
      <div class="participantsInfoSkeleton skeleton-loader" hidden></div>

      <!-- Contact block — contains the candidate's phone -->
      <div class="contactInfo" style="cursor: default;">
        <div class="contactIntegrationIcon" hidden></div>
        <div class="contactName">07941 816663</div>
        <div class="contactInfoSkeleton skeleton-loader" hidden></div>
      </div>

      <span class="separator2" hidden></span>

      <!-- Agent block — contains the recruiter's own details (MUST NOT be scraped) -->
      <div class="agentInfo">
        <div class="agentName">Morgan Parry-Jones</div>
        <div class="agentPhone">07537 158191</div>
        <div class="agentEmail">morgan@swift-recruit.co.uk</div>
      </div>

      <div class="agentInfoSkeleton skeleton-loader" hidden></div>
      <div class="meetLink" hidden></div>
    </div>

    <div class="snippetTitleContainer"></div>
    <div class="controls"></div>
  </div>
</body>
</html>
